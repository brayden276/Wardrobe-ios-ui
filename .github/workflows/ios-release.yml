name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        type: boolean
        required: true
        default: true
      release_notes:
        description: Optional TestFlight release notes
        type: string
        required: false
        default: ""
      repair_signing_assets:
        description: Allow fastlane match to create or repair signing assets
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_IDENTIFIER: ai.wardrobe.app
      APPLE_TEAM_ID: 454Z8R39M9
      UI_API_BASE_URL: ${{ vars.UI_API_BASE_URL }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
      MATCH_GIT_BRANCH: match-signing
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MATCH_READONLY: ${{ inputs.repair_signing_assets && 'false' || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Configure match git access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MATCH_AUTH=$(printf "%s:%s" "$GITHUB_ACTOR" "$GITHUB_TOKEN" | base64)
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"

      - name: Ensure match signing branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin "$MATCH_GIT_BRANCH" > /dev/null; then
            git push origin HEAD:refs/heads/"$MATCH_GIT_BRANCH"
          fi

      - name: Build signed release IPA
        run: bundle exec fastlane ios build_release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-ai-ios-release
          path: build/ios/*
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/WardrobeAI.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
