<ion-content class="app-content" [fullscreen]="true">
  <div class="onboarding-viewport">
    <!-- iOS Navigation Bar -->
    <header class="ios-nav-bar">
      <button
        type="button"
        class="ios-nav-back"
        *ngIf="stepIndex > 0 || canLeave; else navSpacer"
        (click)="handleBack()"
        [attr.aria-label]="stepIndex === 0 ? 'Cancel onboarding' : 'Previous step'"
        [disabled]="isBusy">
        <ion-icon [name]="stepIndex > 0 ? 'chevron-back' : 'close'"></ion-icon>
        <span>{{ stepIndex === 0 ? 'Cancel' : 'Back' }}</span>
      </button>
      <ng-template #navSpacer>
        <span class="ios-nav-spacer"></span>
      </ng-template>

      <div class="ios-nav-title">Personal Style</div>

      <div class="ios-nav-step-badge">
        {{ stepIndex + 1 }} of {{ steps.length }}
      </div>
    </header>

    <!-- Discrete 4-Segment Progress Indicator -->
    <div class="ios-step-indicators" aria-hidden="true">
      <div
        *ngFor="let step of steps; let i = index"
        class="step-indicator-pill"
        [class.completed]="i < stepIndex"
        [class.active]="i === stepIndex">
      </div>
    </div>

    <!-- Main Content Area with Slide Animation -->
    <main class="onboarding-main-stage" [ngClass]="animationDirection">
      <div class="step-header">
        <span class="step-eyebrow">Step {{ stepIndex + 1 }}</span>
        <h1 class="step-title">{{ currentStep.title }}</h1>
        <p class="step-description">{{ currentStep.subtitle }}</p>
      </div>

      <!-- Inset Grouped Selection Rows -->
      <div class="ios-selection-group" role="radiogroup" [attr.aria-label]="currentStep.title">
        <button
          type="button"
          *ngFor="let option of currentStep.options"
          class="ios-selection-row"
          [class.selected]="selectedValue(currentStep.key) === option.value"
          [attr.aria-checked]="selectedValue(currentStep.key) === option.value"
          role="radio"
          (click)="selectAndAdvance(currentStep.key, option.value)">
          
          <div class="selection-content">
            <span class="selection-label">{{ option.label }}</span>
            <span class="selection-subtitle">{{ option.description }}</span>
          </div>

          <div class="selection-accessory" aria-hidden="true">
            <ion-icon
              [name]="selectedValue(currentStep.key) === option.value ? 'checkmark-circle' : 'ellipse-outline'"
              [class.checked]="selectedValue(currentStep.key) === option.value">
            </ion-icon>
          </div>
        </button>
      </div>

      <!-- Error / System Status -->
      <div class="onboarding-feedback" *ngIf="message" aria-live="polite">
        <p class="ios-feedback-text" [class.error]="messageKind === 'error'" [class.success]="messageKind === 'success'">
          <ion-icon [name]="messageKind === 'error' ? 'alert-circle' : 'checkmark-circle'"></ion-icon>
          <span>{{ message }}</span>
        </p>
      </div>
    </main>

    <!-- Pinned Bottom Safe-Area Action Bar -->
    <footer class="onboarding-footer">
      <ion-button
        class="ios-primary-button"
        expand="block"
        (click)="advance()"
        [disabled]="!canContinue || isBusy">
        <ion-spinner *ngIf="isBusy" name="crescent" color="light" class="button-spinner"></ion-spinner>
        <span *ngIf="!isBusy">{{ submitLabel }}</span>
      </ion-button>
    </footer>
  </div>
</ion-content>
