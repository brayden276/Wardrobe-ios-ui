<ion-content class="app-content" [fullscreen]="true">
  <div class="login-viewport">
    <header class="login-brand-header">
      <div class="brand-badge" aria-hidden="true">
        <ion-icon name="shirt-outline"></ion-icon>
      </div>
      <h1 class="brand-title">Wardrobe AI</h1>
      <p class="brand-subtitle">{{ authModeHint }}</p>
    </header>

    <!-- Native iOS Segmented Control -->
    <div class="ios-segmented-control" role="tablist" aria-label="Authentication mode">
      <div class="segmented-thumb" [class.register]="mode === 'register'"></div>
      <button
        type="button"
        class="segmented-item"
        [class.active]="mode === 'login'"
        [attr.aria-selected]="mode === 'login'"
        (click)="setAuthMode('login')"
        role="tab">
        Sign In
      </button>
      <button
        type="button"
        class="segmented-item"
        [class.active]="mode === 'register'"
        [attr.aria-selected]="mode === 'register'"
        (click)="setAuthMode('register')"
        role="tab">
        Create Account
      </button>
    </div>

    <!-- Grouped Form Card -->
    <form class="ios-form" (ngSubmit)="submit()" novalidate>
      <div class="ios-grouped-card">
        <!-- Display Name (Register Mode Only) -->
        <div class="ios-form-row" *ngIf="mode === 'register'">
          <label class="ios-field-label" for="displayNameInput">Name</label>
          <div class="ios-field-wrap">
            <ion-input
              id="displayNameInput"
              class="ios-field-input"
              [(ngModel)]="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              autocapitalize="words"
              spellcheck="false"
              enterkeyhint="next"
              placeholder="Your full name"
              (keyup.enter)="focusInput(emailInputRef)"
              [disabled]="isBusy">
            </ion-input>
          </div>
        </div>

        <!-- Email Field -->
        <div class="ios-form-row" [class.has-error]="showEmailValidationMessage && emailValidationMessage">
          <label class="ios-field-label" for="emailInput">Email</label>
          <div class="ios-field-wrap">
            <ion-input
              #emailInputRef
              id="emailInput"
              class="ios-field-input"
              [(ngModel)]="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="next"
              placeholder="name@example.com"
              (ionBlur)="emailBlurred = true"
              (keyup.enter)="focusInput(passwordInputRef)"
              [disabled]="isBusy">
            </ion-input>
            <ion-icon
              *ngIf="showEmailValidationMessage && emailValidationMessage"
              name="alert-circle-outline"
              class="field-status-icon error"
              aria-hidden="true">
            </ion-icon>
          </div>
        </div>

        <!-- Password Field -->
        <div class="ios-form-row" [class.has-error]="showPasswordValidationMessage && passwordValidationMessage">
          <label class="ios-field-label" for="passwordInput">Password</label>
          <div class="ios-field-wrap">
            <ion-input
              #passwordInputRef
              id="passwordInput"
              class="ios-field-input password-input"
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="go"
              placeholder="Required"
              (keyup.enter)="submit()"
              [disabled]="isBusy">
            </ion-input>
            <button
              type="button"
              class="ios-accessory-button"
              (click)="toggleShowPassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              tabindex="-1">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Stable Inline Feedback Area (No Layout Shift) -->
      <div class="ios-form-feedback" aria-live="polite">
        <p *ngIf="activeErrorMessage" class="ios-feedback-text error">
          <ion-icon name="alert-circle"></ion-icon>
          <span>{{ activeErrorMessage }}</span>
        </p>
        <p *ngIf="!activeErrorMessage && message" class="ios-feedback-text" [class.success]="messageKind === 'success'" [class.error]="messageKind === 'error'">
          <span>{{ message }}</span>
        </p>
      </div>

      <!-- Native iOS Primary Action Button -->
      <ion-button
        class="ios-primary-button"
        expand="block"
        type="submit"
        [disabled]="isBusy">
        <ion-spinner *ngIf="isBusy" name="crescent" color="light" class="button-spinner"></ion-spinner>
        <span *ngIf="!isBusy">{{ authSubmitLabel }}</span>
      </ion-button>
    </form>
  </div>
</ion-content>
